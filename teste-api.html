<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de API - Painel TR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #FF8000;
            border-bottom: 2px solid #FF8000;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-left: 4px solid #FF8000;
            border-radius: 4px;
        }
        button {
            background: #FF8000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #E67300;
        }
        .output {
            margin-top: 10px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            color: #10B981;
            font-weight: bold;
        }
        .error {
            color: #EF4444;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Teste de API - Painel TR</h1>

        <div class="section">
            <h2>1. Configuração da API</h2>
            <div class="output" id="configOutput">Carregando...</div>
        </div>

        <div class="section">
            <h2>2. Login</h2>
            <label>Usuário:</label>
            <input type="text" id="loginUser" value="admin" placeholder="admin">
            <label>Senha:</label>
            <input type="password" id="loginPass" value="admin123" placeholder="admin123">
            <button onclick="testarLogin()">🔐 Testar Login</button>
            <div class="output" id="loginOutput">Aguardando teste...</div>
        </div>

        <div class="section">
            <h2>3. Listar Produtos</h2>
            <button onclick="testarListarProdutos()">📋 Listar Produtos</button>
            <div class="output" id="produtosListOutput">Aguardando teste...</div>
        </div>

        <div class="section">
            <h2>4. Criar Produto</h2>
            <label>Nome:</label>
            <input type="text" id="produtoNome" value="Produto Teste" placeholder="Nome do produto">
            <label>Descrição:</label>
            <input type="text" id="produtoDesc" value="Descrição teste" placeholder="Descrição">
            <label>Categoria:</label>
            <input type="text" id="produtoCategoria" value="SPED" placeholder="Categoria">
            <button onclick="testarCriarProduto()">➕ Criar Produto</button>
            <div class="output" id="produtoCreateOutput">Aguardando teste...</div>
        </div>

        <div class="section">
            <h2>5. Listar Consultores</h2>
            <button onclick="testarListarConsultores()">👥 Listar Consultores</button>
            <div class="output" id="consultoresListOutput">Aguardando teste...</div>
        </div>

        <div class="section">
            <h2>📝 Console Logs</h2>
            <button onclick="document.getElementById('consoleOutput').innerHTML = 'Limpo!'">🧹 Limpar</button>
            <div class="output" id="consoleOutput">Console vazio</div>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script>
        // Capturar console.log
        const consoleOutput = document.getElementById('consoleOutput');
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleOutput.innerHTML += args.join(' ') + '\n';
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            consoleOutput.innerHTML += '<span class="error">' + args.join(' ') + '</span>\n';
        };

        // Mostrar configuração
        document.getElementById('configOutput').innerHTML =
            `URL Base: ${API_CONFIG.baseURL}\n` +
            `Hostname: ${window.location.hostname}\n` +
            `Origin: ${window.location.origin}\n` +
            `Token armazenado: ${localStorage.getItem('authToken') ? 'Sim' : 'Não'}`;

        async function testarLogin() {
            const output = document.getElementById('loginOutput');
            output.innerHTML = 'Testando...';

            try {
                const username = document.getElementById('loginUser').value;
                const password = document.getElementById('loginPass').value;

                const response = await api.post('/auth/login', { username, password });

                output.innerHTML = `<span class="success">✅ Login bem-sucedido!</span>\n` +
                    `Token: ${response.token.substring(0, 50)}...\n` +
                    `Usuário: ${response.user.name}\n` +
                    `Perfil: ${response.user.perfil}`;
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Erro no login:</span>\n${error.message}`;
            }
        }

        async function testarListarProdutos() {
            const output = document.getElementById('produtosListOutput');
            output.innerHTML = 'Buscando...';

            try {
                const produtos = await api.get('/produtos');
                output.innerHTML = `<span class="success">✅ ${produtos.length} produto(s) encontrado(s):</span>\n` +
                    JSON.stringify(produtos, null, 2);
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Erro ao listar:</span>\n${error.message}`;
            }
        }

        async function testarCriarProduto() {
            const output = document.getElementById('produtoCreateOutput');
            output.innerHTML = 'Criando...';

            try {
                const produtoData = {
                    nome: document.getElementById('produtoNome').value,
                    descricao: document.getElementById('produtoDesc').value,
                    categoria: document.getElementById('produtoCategoria').value,
                    cor: '#FF8000'
                };

                const response = await api.post('/produtos', produtoData);
                output.innerHTML = `<span class="success">✅ Produto criado com sucesso!</span>\n` +
                    `ID: ${response.id}\n` +
                    JSON.stringify(response, null, 2);
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Erro ao criar:</span>\n${error.message}`;
            }
        }

        async function testarListarConsultores() {
            const output = document.getElementById('consultoresListOutput');
            output.innerHTML = 'Buscando...';

            try {
                const consultores = await api.get('/consultores');
                output.innerHTML = `<span class="success">✅ ${consultores.length} consultor(es) encontrado(s):</span>\n` +
                    JSON.stringify(consultores, null, 2);
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Erro ao listar:</span>\n${error.message}`;
            }
        }
    </script>
</body>
</html>
